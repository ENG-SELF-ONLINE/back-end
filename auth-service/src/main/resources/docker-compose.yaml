version: '3'

services:

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: 'keycloak'
    restart: always
    env_file:
      - keycloak.env
    command:
      - start-dev
    depends_on:
      - postgres
    volumes:
      - keycloak-data:/opt/keycloak/data
    links:
      - "postgres:postgres"
    ports:
      - "18080:8080"

  postgres:
    container_name: 'postgres'
    image: 'postgres:15'
    restart: always
    env_file:
      - postgres.env
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mynetwork

volumes:
  db-data:
    driver: local
  keycloak-data:
    driver: local

networks:
  mynetwork:
    driver: bridge